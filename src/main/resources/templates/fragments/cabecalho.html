<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="cabecalho" class="cabecalho">
    <a class="marca" th:href="@{/}">Login Seguro</a>
    <nav>
        <div sec:authorize="isAuthenticated()" class="nav-logado">
            <span sec:authentication="name"></span>
            <a th:href="@{/painel}">Painel</a>
            <form th:action="@{/logout}" method="post" class="form-logout">
                <button type="submit">Sair</button>
            </form>
        </div>
        <div sec:authorize="isAnonymous()" class="nav-anonimo">
            <a th:href="@{/login}">Entrar</a>
            <a th:href="@{/registro}">Criar conta</a>
        </div>
    </nav>
</header>
</body>
</html>
