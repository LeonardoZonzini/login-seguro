<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, conteudo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${titulo}">Login Seguro</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main class="conteudo">
    <th:block th:replace="${conteudo}"></th:block>
</main>
<footer th:replace="~{fragments/rodape :: rodape}"></footer>
</body>
</html>
