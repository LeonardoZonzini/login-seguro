<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Criar conta</title>
</head>
<body>
<section class="caixa-formulario">
    <h1>Criar conta</h1>

    <form th:action="@{/registro}" th:object="${registroForm}" method="post" class="formulario">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>

        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="senha">Senha</label>
        <input type="password" id="senha" th:field="*{senha}" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p>

        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></p>

        <button type="submit">Criar conta</button>
    </form>

    <p class="link-secundario">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
</section>
</body>
</html>
